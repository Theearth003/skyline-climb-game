name: Instagram public monitor scan

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Run public monitor scan
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            -X POST \
            -H "Accept: application/json" \
            "https://instagram-public-monitor.onrender.com/api/scan"
